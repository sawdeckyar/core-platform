name: Weekly Database Backup

on:
  schedule:
    - cron: '0 9 * * 0'  # Every Sunday at 9am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Supabase tables to CSV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups/$DATE

          TABLES="customers vehicles estimates estimate_items invoices invoice_items inspections inspection_items appointments shop_settings staff_users"

          for TABLE in $TABLES; do
            echo "Exporting $TABLE..."
            curl -s "$SUPABASE_URL/rest/v1/$TABLE?select=*" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -o "backups/$DATE/$TABLE.json"
          done

          echo "✅ Backup complete for $DATE"
          ls -lh backups/$DATE/

      - name: Upload backup to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90

      - name: Summary
        run: |
          echo "### ✅ Weekly Backup Complete" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Tables backed up: customers, vehicles, estimates, invoices, inspections, appointments, settings" >> $GITHUB_STEP_SUMMARY
