name: Weekly Database Backup
on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export Supabase tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups/$DATE
          for TABLE in customers vehicles estimates estimate_items invoices invoice_items inspections appointments shop_settings; do
            curl -s "$SUPABASE_URL/rest/v1/$TABLE?select=*" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -o "backups/$DATE/$TABLE.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
